<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandering Bezier Worms</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Cubic bezier point
function bezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16),
  ];
}

const PALETTE   = ['#ff6b9d', '#45d4fa', '#a78bfa', '#34d399', '#fbbf24'];
const TRAIL_LEN = 450;   // body length in steps
const T_STEP    = 0.0028; // ~1 pixel per step along a typical segment
const STEPS_PER_FRAME = 3;
const PX        = 2;     // pixel dot size

class Worm {
  constructor(color) {
    this.rgb  = hexToRgb(color);
    this.trail = [];         // [{x,y}] oldest → newest
    this.wanderAngle = Math.random() * Math.PI * 2;

    // Initial random cubic segment
    this.p0 = this._rand();
    this.p1 = this._rand();
    this.p2 = this._rand();
    this.p3 = this._rand();
    this.t  = 0;
  }

  _rand() {
    return {
      x: 80 + Math.random() * (canvas.width  - 160),
      y: 80 + Math.random() * (canvas.height - 160),
    };
  }

  // When t reaches 1: slide the window forward.
  // Remove conceptual "first point" by making old p3 the new p0,
  // mirror old p2 around p3 for C1 continuity (new p1),
  // then wander to a fresh p3 with a random p2 in between.
  _extend() {
    const np0 = { ...this.p3 };
    const np1 = {
      x: 2 * this.p3.x - this.p2.x,
      y: 2 * this.p3.y - this.p2.y,
    };
    this.wanderAngle += (Math.random() - 0.5) * 1.3;
    const d   = 120 + Math.random() * 200;
    const np3 = {
      x: clamp(np0.x + Math.cos(this.wanderAngle) * d, 80, canvas.width  - 80),
      y: clamp(np0.y + Math.sin(this.wanderAngle) * d, 80, canvas.height - 80),
    };
    const np2 = {
      x: (np1.x + np3.x) / 2 + (Math.random() - 0.5) * 130,
      y: (np1.y + np3.y) / 2 + (Math.random() - 0.5) * 130,
    };
    this.p0 = np0; this.p1 = np1;
    this.p2 = np2; this.p3 = np3;
    this.t  = 0;
  }

  // Advance one pixel-step along the current bezier segment
  step() {
    if (this.t >= 1) this._extend();
    this.trail.push(bezier(this.p0, this.p1, this.p2, this.p3, this.t));
    if (this.trail.length > TRAIL_LEN) this.trail.shift(); // tail erases
    this.t += T_STEP;
  }

  update() {
    for (let i = 0; i < STEPS_PER_FRAME; i++) this.step();
  }

  draw() {
    const [r, g, b] = this.rgb;
    const len = this.trail.length;

    // Draw body in alpha bands to avoid per-pixel fillStyle changes
    const BANDS = 20;
    const band  = Math.ceil(len / BANDS);
    for (let bnd = 0; bnd < BANDS; bnd++) {
      const alpha = ((bnd + 1) / BANDS) ** 1.6;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(4)})`;
      const from = bnd * band;
      const to   = Math.min(from + band, len);
      for (let i = from; i < to; i++) {
        ctx.fillRect(this.trail[i].x | 0, this.trail[i].y | 0, PX, PX);
      }
    }

    // Bright glowing head
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = `rgb(${r},${g},${b})`;
    const headLen = Math.min(18, len);
    for (let i = len - headLen; i < len; i++) {
      ctx.fillRect(this.trail[i].x | 0, this.trail[i].y | 0, PX, PX);
    }
    ctx.shadowBlur = 0;
  }
}

const worms = PALETTE.map(c => new Worm(c));

function frame() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const worm of worms) {
    worm.update();
    worm.draw();
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
