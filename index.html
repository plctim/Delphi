<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandering Bezier Curves</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const COLORS = [
  '#ff6b9d',
  '#45d4fa',
  '#a78bfa',
  '#34d399',
  '#fbbf24',
];

// Each curve has 4 control points for a cubic bezier.
// Each point drifts with its own velocity and slowly steers via perlin-like noise.
class Point {
  constructor() {
    this.x = Math.random() * window.innerWidth;
    this.y = Math.random() * window.innerHeight;
    const speed = 0.4 + Math.random() * 0.6;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.angleOffset = Math.random() * 1000;
    this.turnSpeed = 0.002 + Math.random() * 0.003;
    this.speed = speed;
  }

  update(t) {
    // Gently steer using a slow-changing angle
    const steer = Math.sin(t * this.turnSpeed + this.angleOffset) * 0.04;
    const len = Math.hypot(this.vx, this.vy);
    // Rotate velocity vector slightly
    const cos = Math.cos(steer), sin = Math.sin(steer);
    const nx = this.vx * cos - this.vy * sin;
    const ny = this.vx * sin + this.vy * cos;
    this.vx = (nx / len) * this.speed;
    this.vy = (ny / len) * this.speed;

    this.x += this.vx;
    this.y += this.vy;

    // Wrap around edges
    const W = canvas.width, H = canvas.height;
    if (this.x < -50) this.x = W + 50;
    if (this.x > W + 50) this.x = -50;
    if (this.y < -50) this.y = H + 50;
    if (this.y > H + 50) this.y = -50;
  }
}

class Curve {
  constructor(color) {
    this.color = color;
    this.points = Array.from({ length: 4 }, () => new Point());
  }

  update(t) {
    this.points.forEach(p => p.update(t));
  }

  draw() {
    const [p0, p1, p2, p3] = this.points;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

const curves = COLORS.map(c => new Curve(c));

let t = 0;

function frame() {
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  curves.forEach(curve => {
    curve.update(t);
    curve.draw();
  });

  t++;
  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
