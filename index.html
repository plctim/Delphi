<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandering Bezier Worms</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.07);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 28px;
      font-size: 15px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      transition: background 0.15s;
      user-select: none;
    }
    button:hover  { background: rgba(255,255,255,0.16); }
    button:active { background: rgba(255,255,255,0.28); }
    #count {
      position: fixed;
      bottom: 30px;
      right: 22px;
      color: rgba(255,255,255,0.28);
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <button id="btn-remove">− Remove</button>
  <button id="btn-add">+ Add</button>
</div>
<div id="count"></div>
<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const countEl = document.getElementById('count');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Bezier helpers ────────────────────────────────────────────────────────────

function bezierPt(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16),
  ];
}

// ── Pre-render a shiny 3-D sphere bead onto an offscreen canvas ───────────────

function makeBead(r, g, b, size) {
  const c  = document.createElement('canvas');
  c.width  = c.height = size;
  const oc = c.getContext('2d');
  const cx = size / 2, cy = size / 2, rad = size / 2;

  // Clip everything to a circle
  oc.beginPath();
  oc.arc(cx, cy, rad - 0.5, 0, Math.PI * 2);
  oc.clip();

  // Diffuse layer: lit from upper-left, fades to near-black at lower-right
  const diffuse = oc.createRadialGradient(
    cx - rad * 0.28, cy - rad * 0.28, 0,
    cx, cy, rad
  );
  diffuse.addColorStop(0,   `rgb(${Math.min(255,r+100)},${Math.min(255,g+100)},${Math.min(255,b+100)})`);
  diffuse.addColorStop(0.5, `rgb(${r},${g},${b})`);
  diffuse.addColorStop(1,   `rgb(${r*0.15|0},${g*0.15|0},${b*0.15|0})`);
  oc.fillStyle = diffuse;
  oc.fillRect(0, 0, size, size);

  // Specular highlight: tight bright dot toward upper-left
  const spec = oc.createRadialGradient(
    cx - rad * 0.40, cy - rad * 0.42, 0,
    cx - rad * 0.40, cy - rad * 0.42, rad * 0.58
  );
  spec.addColorStop(0,    'rgba(255,255,255,0.92)');
  spec.addColorStop(0.40, 'rgba(255,255,255,0.22)');
  spec.addColorStop(1,    'rgba(255,255,255,0)');
  oc.fillStyle = spec;
  oc.fillRect(0, 0, size, size);

  // Subtle rim darkening at edge
  const rim = oc.createRadialGradient(cx, cy, rad * 0.7, cx, cy, rad);
  rim.addColorStop(0, 'rgba(0,0,0,0)');
  rim.addColorStop(1, 'rgba(0,0,0,0.45)');
  oc.fillStyle = rim;
  oc.fillRect(0, 0, size, size);

  return c;
}

// ── Palette ───────────────────────────────────────────────────────────────────

const ALL_COLORS = [
  '#ff6b9d', '#45d4fa', '#a78bfa', '#34d399', '#fbbf24',
  '#f97316', '#38bdf8', '#c084fc', '#4ade80', '#fb923c',
  '#e879f9', '#2dd4bf', '#facc15', '#f87171', '#60a5fa',
];

// ── Worm ──────────────────────────────────────────────────────────────────────

const BEAD_SIZE       = 22;  // diameter of each 3-D bead (px)
const BEAD_SPACING    = 5;   // min screen-distance between stored trail points
const TRAIL_LEN       = 180; // max stored bead count (= body length)
const T_STEP          = 0.004;
const STEPS_PER_FRAME = 7;

class Worm {
  constructor(color) {
    const [r, g, b] = hexToRgb(color);
    this.bead  = makeBead(r, g, b, BEAD_SIZE);
    this.trail = [];
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.p0 = this._rand();
    this.p1 = this._rand();
    this.p2 = this._rand();
    this.p3 = this._rand();
    this.t  = 0;
  }

  _rand() {
    return {
      x: 100 + Math.random() * (canvas.width  - 200),
      y: 100 + Math.random() * (canvas.height - 200),
    };
  }

  // Slide the bezier window forward: old end → new start, wander to new end.
  // C1 continuity: reflect old p2 around p3 to get new p1 (matching tangent).
  _extend() {
    const np0 = { ...this.p3 };
    const np1 = { x: 2*this.p3.x - this.p2.x, y: 2*this.p3.y - this.p2.y };
    this.wanderAngle += (Math.random() - 0.5) * 1.3;
    const d   = 130 + Math.random() * 230;
    const np3 = {
      x: clamp(np0.x + Math.cos(this.wanderAngle) * d, 100, canvas.width  - 100),
      y: clamp(np0.y + Math.sin(this.wanderAngle) * d, 100, canvas.height - 100),
    };
    const np2 = {
      x: (np1.x + np3.x) / 2 + (Math.random() - 0.5) * 150,
      y: (np1.y + np3.y) / 2 + (Math.random() - 0.5) * 150,
    };
    this.p0 = np0; this.p1 = np1;
    this.p2 = np2; this.p3 = np3;
    this.t  = 0;
  }

  step() {
    if (this.t >= 1) this._extend();
    const pt   = bezierPt(this.p0, this.p1, this.p2, this.p3, this.t);
    const last = this.trail[this.trail.length - 1];
    // Only store a new bead when the head has moved far enough
    if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= BEAD_SPACING) {
      this.trail.push(pt);
      if (this.trail.length > TRAIL_LEN) this.trail.shift(); // tail erases
    }
    this.t += T_STEP;
  }

  update() {
    for (let i = 0; i < STEPS_PER_FRAME; i++) this.step();
  }

  draw() {
    const len  = this.trail.length;
    const half = BEAD_SIZE / 2;
    for (let i = 0; i < len; i++) {
      // Fade from transparent at tail to opaque at head
      ctx.globalAlpha = ((i + 1) / len) ** 1.6;
      ctx.drawImage(this.bead, this.trail[i].x - half | 0, this.trail[i].y - half | 0);
    }
    ctx.globalAlpha = 1;
  }
}

// ── Setup ─────────────────────────────────────────────────────────────────────

let colorCursor = 0;
const worms = [];

function addWorm() {
  worms.push(new Worm(ALL_COLORS[colorCursor++ % ALL_COLORS.length]));
  updateCount();
}
function removeWorm() {
  if (worms.length > 1) { worms.pop(); updateCount(); }
}
function updateCount() {
  countEl.textContent = `${worms.length} worm${worms.length !== 1 ? 's' : ''}`;
}

for (let i = 0; i < 5; i++) addWorm();

document.getElementById('btn-add').addEventListener('click', addWorm);
document.getElementById('btn-remove').addEventListener('click', removeWorm);

// ── Render loop ───────────────────────────────────────────────────────────────

function frame() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const worm of worms) {
    worm.update();
    worm.draw();
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
