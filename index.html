<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandering Bezier Ribbons</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { display: block; }
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.07);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 28px;
      font-size: 15px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      transition: background 0.15s;
      user-select: none;
    }
    button:hover  { background: rgba(255,255,255,0.16); }
    button:active { background: rgba(255,255,255,0.28); }
    #count {
      position: fixed;
      bottom: 30px;
      right: 22px;
      color: rgba(255,255,255,0.28);
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <button id="btn-remove">− Remove</button>
  <button id="btn-add">+ Add</button>
</div>
<div id="count"></div>
<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const countEl = document.getElementById('count');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Bezier / math helpers ─────────────────────────────────────────────────────

function bezierPt(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
  };
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// ── Ribbon constants ──────────────────────────────────────────────────────────

const HALF_W          = 18;    // half-width of ribbon (px)
// Oblique projection: depth component of twist shifts the centre position
const DEPTH_X         =  0.20;
const DEPTH_Y         = -0.13;
const TRAIL_LEN       = 160;   // max stored trail points per worm
const PT_SPACING      = 5;     // min screen-px between stored trail points
const T_STEP          = 0.004;
const STEPS_PER_FRAME = 7;

// ── Palette ───────────────────────────────────────────────────────────────────

const ALL_COLORS = [
  '#ff6b9d', '#45d4fa', '#a78bfa', '#34d399', '#fbbf24',
  '#f97316', '#38bdf8', '#c084fc', '#4ade80', '#fb923c',
  '#e879f9', '#2dd4bf', '#facc15', '#f87171', '#60a5fa',
];

// ── Worm ──────────────────────────────────────────────────────────────────────

class Worm {
  constructor(color) {
    const [r, g, b] = hexToRgb(color);
    this.r = r; this.g = g; this.b = b;
    // Lighter tint for edge highlights
    this.hr = Math.min(255, r + 90);
    this.hg = Math.min(255, g + 90);
    this.hb = Math.min(255, b + 90);

    this.trail = [];           // [ {x, y, twist} ]
    this.twist = Math.random() * Math.PI * 2;
    // Slightly varied twist rate per worm for visual diversity
    this.twistRate = 0.042 + Math.random() * 0.028;

    this.wanderAngle = Math.random() * Math.PI * 2;
    this.p0 = this._rand(); this.p1 = this._rand();
    this.p2 = this._rand(); this.p3 = this._rand();
    this.t  = 0;
  }

  _rand() {
    return {
      x: 100 + Math.random() * (canvas.width  - 200),
      y: 100 + Math.random() * (canvas.height - 200),
    };
  }

  // Slide bezier window: remove old start, add new end with C1-smooth join.
  _extend() {
    const np0 = { ...this.p3 };
    const np1 = { x: 2*this.p3.x - this.p2.x, y: 2*this.p3.y - this.p2.y };
    this.wanderAngle += (Math.random() - 0.5) * 1.3;
    const d   = 130 + Math.random() * 230;
    const np3 = {
      x: clamp(np0.x + Math.cos(this.wanderAngle) * d, 100, canvas.width  - 100),
      y: clamp(np0.y + Math.sin(this.wanderAngle) * d, 100, canvas.height - 100),
    };
    const np2 = {
      x: (np1.x + np3.x) / 2 + (Math.random() - 0.5) * 150,
      y: (np1.y + np3.y) / 2 + (Math.random() - 0.5) * 150,
    };
    this.p0 = np0; this.p1 = np1; this.p2 = np2; this.p3 = np3;
    this.t  = 0;
  }

  // Unit vector perpendicular to the path tangent at trail index i.
  _perp(i) {
    const t = this.trail, l = t.length;
    const prev = t[Math.max(0, i - 1)];
    const next = t[Math.min(l - 1, i + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    return [-dy / len, dx / len];
  }

  step() {
    if (this.t >= 1) this._extend();
    const pt   = bezierPt(this.p0, this.p1, this.p2, this.p3, this.t);
    const last = this.trail[this.trail.length - 1];
    if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= PT_SPACING) {
      this.trail.push({ x: pt.x, y: pt.y, twist: this.twist });
      this.twist += this.twistRate;
      if (this.trail.length > TRAIL_LEN) this.trail.shift();
    }
    this.t += T_STEP;
  }

  update() {
    for (let i = 0; i < STEPS_PER_FRAME; i++) this.step();
  }

  draw() {
    const len = this.trail.length;
    if (len < 2) return;
    const { r, g, b, hr, hg, hb } = this;

    // ── Ribbon quad strip ─────────────────────────────────────────────────────
    // Each pair of trail points forms a quadrilateral.
    // cos(twist)  → projected half-width  (0 = edge-on, ±1 = face-on)
    // sin(twist)  → depth offset via oblique projection
    // shade        → front face bright (1.0), back face dark (0.15)

    for (let i = 0; i < len - 1; i++) {
      const pA = this.trail[i];
      const pB = this.trail[i + 1];

      const [pax, pay] = this._perp(i);
      const [pbx, pby] = this._perp(i + 1);

      const sA = Math.sin(pA.twist), cA = Math.cos(pA.twist);
      const sB = Math.sin(pB.twist), cB = Math.cos(pB.twist);

      // Centre of ribbon at each end, shifted by depth component
      const acx = pA.x + sA * HALF_W * DEPTH_X, acy = pA.y + sA * HALF_W * DEPTH_Y;
      const bcx = pB.x + sB * HALF_W * DEPTH_X, bcy = pB.y + sB * HALF_W * DEPTH_Y;

      // Screen-space half-width (collapses to 0 at edge-on)
      const wA = cA * HALF_W, wB = cB * HALF_W;

      // Four corners: left-A, right-A, right-B, left-B
      const x0 = acx + pax * wA, y0 = acy + pay * wA;
      const x1 = acx - pax * wA, y1 = acy - pay * wA;
      const x2 = bcx - pbx * wB, y2 = bcy - pby * wB;
      const x3 = bcx + pbx * wB, y3 = bcy + pby * wB;

      // Shading: cos=+1 → full bright, cos=−1 → 15% (dark back face)
      const shade = 0.15 + 0.85 * (cA * 0.5 + 0.5);
      const ri = Math.min(255, r * shade) | 0;
      const gi = Math.min(255, g * shade) | 0;
      const bi = Math.min(255, b * shade) | 0;

      // Tail-to-head alpha fade
      const alpha = ((i + 1) / len) ** 1.3;

      ctx.fillStyle = `rgba(${ri},${gi},${bi},${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.closePath();
      ctx.fill();
    }

    // ── Edge highlight lines ──────────────────────────────────────────────────
    // Thin bright lines along both long edges of the ribbon.
    // When the ribbon is edge-on the two edges meet at a point, creating the
    // characteristic bright gleam of a twisting ribbon.
    // A gradient from tail-end to head-end approximates the alpha fade cheaply.

    ctx.lineWidth = 1.5;
    const tail = this.trail[0], head = this.trail[len - 1];

    for (const side of [-1, 1]) {
      // Endpoints for gradient direction (approximate; good enough for wandering paths)
      const tPerp = this._perp(0);
      const hPerp = this._perp(len - 1);
      const tx = tail.x + Math.sin(tail.twist) * HALF_W * DEPTH_X + tPerp[0] * Math.cos(tail.twist) * HALF_W * side;
      const ty = tail.y + Math.sin(tail.twist) * HALF_W * DEPTH_Y + tPerp[1] * Math.cos(tail.twist) * HALF_W * side;
      const hx = head.x + Math.sin(head.twist) * HALF_W * DEPTH_X + hPerp[0] * Math.cos(head.twist) * HALF_W * side;
      const hy = head.y + Math.sin(head.twist) * HALF_W * DEPTH_Y + hPerp[1] * Math.cos(head.twist) * HALF_W * side;

      const grad = ctx.createLinearGradient(tx, ty, hx, hy);
      grad.addColorStop(0,    `rgba(${hr},${hg},${hb},0)`);
      grad.addColorStop(0.25, `rgba(${hr},${hg},${hb},0.15)`);
      grad.addColorStop(1,    `rgba(${hr},${hg},${hb},0.6)`);
      ctx.strokeStyle = grad;

      ctx.beginPath();
      for (let i = 0; i < len; i++) {
        const p  = this.trail[i];
        const [px, py] = this._perp(i);
        const s = Math.sin(p.twist), c = Math.cos(p.twist);
        const ex = p.x + s * HALF_W * DEPTH_X + px * c * HALF_W * side;
        const ey = p.y + s * HALF_W * DEPTH_Y + py * c * HALF_W * side;
        i === 0 ? ctx.moveTo(ex, ey) : ctx.lineTo(ex, ey);
      }
      ctx.stroke();
    }
  }
}

// ── Setup ─────────────────────────────────────────────────────────────────────

let colorCursor = 0;
const worms = [];

function addWorm() {
  worms.push(new Worm(ALL_COLORS[colorCursor++ % ALL_COLORS.length]));
  updateCount();
}
function removeWorm() {
  if (worms.length > 1) { worms.pop(); updateCount(); }
}
function updateCount() {
  countEl.textContent = `${worms.length} ribbon${worms.length !== 1 ? 's' : ''}`;
}

for (let i = 0; i < 5; i++) addWorm();

document.getElementById('btn-add').addEventListener('click', addWorm);
document.getElementById('btn-remove').addEventListener('click', removeWorm);

// ── Render loop ───────────────────────────────────────────────────────────────

function frame() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const worm of worms) {
    worm.update();
    worm.draw();
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
